# Produção numa VPS: Postgres + API + web + Caddy (HTTPS automático) + manutenção.
# Uso: docker compose -f docker-compose.prod.yml up -d --build   (guia: docs/deploy-vps.md)
# Só o Caddy expõe portas (80/443). Banco e API ficam na rede interna.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: leia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: leia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leia"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://leia:${POSTGRES_PASSWORD}@db:5432/leia
      COOKIE_SEGURO: "true"
      URL_PUBLICA: https://${DOMINIO}  # retorno do login com Google/Microsoft
      AQUECER_MODELOS: "true"
      MODO_TESTE: "false"
    volumes:
      - hfcache:/cache/huggingface
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 40
      # 1a subida baixa ~1,7 GB de modelos e gera embeddings: levou ~17 min no teste local
      start_period: 1800s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args: { LEIA_API_URL: "http://api:8000" }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }

  manutencao:
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://leia:${POSTGRES_PASSWORD}@db:5432/leia
    # Expira reservas prontas não retiradas, de hora em hora (idempotente).
    command: ["sh", "-c", "while true; do uv run --no-sync python -m leia_api.manutencao; sleep 3600; done"]
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [web]

volumes:
  pgdata:
  hfcache:
  caddydata:
