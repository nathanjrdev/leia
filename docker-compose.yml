services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leia}
      POSTGRES_DB: ${POSTGRES_DB:-leia}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leia}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
